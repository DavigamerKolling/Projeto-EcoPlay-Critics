<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoPlay Critics - Criar Jogo</title>

  <link rel="stylesheet" href="css/criarjogo.css" />
</head>
<body>
  <header class="navbar">
    <div class="brand">
     <a href="index.html" class="logo-link">
       <img src="img/logo.png" alt="EcoPlay Critics" class="logo-img">
     </a>
    </div>

    <nav class="navlinks">
      <a href="jogos.html">Jogos</a><span>|</span>
      <a href="sobre.html">Sobre Nós</a><span>|</span>
      <a href="ajuda.html">Ajuda</a>
    </nav>

    <div class="navright">
      <div class="searchwrap">
        <input type="text" placeholder="Procurar" />
        <span class="search-icon">🔍</span>
      </div>
      <div class="profile-area">
        <div class="profile" onclick="toggleMenu()" title="Conta">
        <img src="img/profile.png" alt="Perfil">
        </div>
        <div class="dropdown" id="dropdown">
          <button onclick="logout()">Sair</button>
        </div>
      </div>
    </div>
  </header>

  <main class="content">
    <form id="createGameForm" class="card">
      <input id="title" class="inp" type="text" placeholder="Nome do Jogo" required />

      <textarea id="description" class="area" placeholder="Descrição do Jogo" required></textarea>

      <label class="lbl">Capa do Jogo:</label>
      <input id="cover" type="file" accept="image/*" required />
      <button class="mini-btn" type="button" id="btnCoverInfo">Enviar</button>

      <label class="lbl">Imagens e Vídeos do Jogo:</label>
      <input id="mediaFiles" type="file" accept="image/*,video/*" multiple />
      <button class="mini-btn" type="button" id="btnMediaInfo">Enviar</button>

      <label class="lbl">Trailer (YouTube) - opcional:</label>
      <input id="youtube" class="inp" type="text" placeholder="Cole o link do YouTube (opcional)" />

      <select class="sel" id="plat1"><option value="">Plataforma 1</option></select>
      <select class="sel" id="plat2"><option value="">Plataforma 2</option></select>
      <select class="sel" id="plat3"><option value="">Plataforma 3</option></select>
      <select class="sel" id="plat4"><option value="">Plataforma 4</option></select>
      <select class="sel" id="plat5"><option value="">Plataforma 5</option></select>
      <select class="sel" id="plat6"><option value="">Plataforma 6</option></select>
      <select class="sel" id="plat7"><option value="">Plataforma 7</option></select>
      <select class="sel" id="plat8"><option value="">Plataforma 8</option></select>

      <h3>Links das Plataformas</h3>

<input type="text" id="linkSteam" placeholder="Link da Steam">
<input type="text" id="linkEpic" placeholder="Link da Epic Games">
<input type="text" id="linkPlaystation" placeholder="Link da PlayStation Store">
<input type="text" id="linkXbox" placeholder="Link da Xbox Store">
<input type="text" id="linkSwitch" placeholder="Link da Nintendo Store">
<input type="text" id="linkAndroid" placeholder="Link da Google Play / Netflix">
<input type="text" id="linkApple" placeholder="Link da App Store">
<input type="text" id="linkLinux" placeholder="Link da versão Linux (ex: itch.io)">


      <button class="main-btn" type="submit">Enviar</button>
      <p id="msg" class="msg"></p>
    </form>
  </main>

  <script src="js/criarjogo.js"></script>
  <script src="js/logout.js"></script>
</body>
</html>
