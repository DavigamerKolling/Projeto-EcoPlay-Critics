<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta name="color-scheme" content="light">
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>EcoPlay Critics - Editar Jogo</title>

  <link rel="stylesheet" href="css/criarjogo.css" />
</head>
<body>
  <header class="navbar">
    <div class="brand">
      <a href="index.html" class="logo-link">
       <img src="img/logo.png" alt="EcoPlay Critics" class="logo-img">
     </a>
    </div>

    <nav class="navlinks">
      <a href="jogos.html">Jogos</a><span>|</span>
      <a href="sobre.html">Sobre Nós</a><span>|</span>
      <a href="ajuda.html">Ajuda</a>
    </nav>

    <div class="navright">
      <div class="searchwrap">
        <input type="text" placeholder="Procurar" />
        <span class="search-icon">🔍</span>
      </div>
      <div class="profile-area">
        <div class="profile" onclick="toggleMenu()" title="Conta">
        <img src="img/profile.png" alt="Perfil">
        </div>
        <div class="dropdown" id="dropdown">
          <button onclick="logout()">Sair</button>
        </div>
      </div>
    </div>
  </header>

  <main class="content">
    <form id="createGameForm" class="card">
      <input id="title" class="inp" type="text" placeholder="Nome do Jogo" required />

      <textarea id="description" class="area" placeholder="Descrição do Jogo" required></textarea>

      <label class="lbl">Capa do Jogo:</label>
      <input id="cover" type="file" accept="image/*" />
      <button class="mini-btn" type="button" id="btnCoverInfo">Enviar</button>

      <div id="currentCoverWrap" style="margin-top:10px;">
        <p style="font-size:12px;opacity:.8;margin-bottom:6px;">Capa atual:</p>
        <img id="currentCover" src="" alt="Capa atual" style="width:180px;height:220px;object-fit:cover;border-radius:6px;display:none;">
      </div>

      <label class="lbl">Imagens e Vídeos do Jogo:</label>
      <input id="mediaFiles" type="file" accept="image/*,video/*" multiple />
      <button class="mini-btn" type="button" id="btnMediaInfo">Enviar</button>

      <div id="currentMediaWrap" style="margin-top:10px;">
        <p style="font-size:12px;opacity:.8;margin-bottom:6px;">Mídias atuais:</p>
        <div id="currentMedia" style="display:flex;gap:10px;flex-wrap:wrap;"></div>
        <p style="font-size:12px;opacity:.75;margin-top:8px;">
          Se você não selecionar novos arquivos, o jogo mantém as mídias atuais.
        </p>
      </div>

      <label class="lbl">Trailer (YouTube) - opcional:</label>
      <input id="youtube" class="inp" type="text" placeholder="Cole o link do YouTube (opcional)" />

      <select class="sel" id="plat1"><option value="">Plataforma 1</option></select>
      <select class="sel" id="plat2"><option value="">Plataforma 2</option></select>
      <select class="sel" id="plat3"><option value="">Plataforma 3</option></select>
      <select class="sel" id="plat4"><option value="">Plataforma 4</option></select>
      <select class="sel" id="plat5"><option value="">Plataforma 5</option></select>
      <select class="sel" id="plat6"><option value="">Plataforma 6</option></select>
      <select class="sel" id="plat7"><option value="">Plataforma 7</option></select>
      <select class="sel" id="plat8"><option value="">Plataforma 8</option></select>

      <label class="lbl">Links do jogo nas plataformas (opcional):</label>
      <input id="linkSteam" class="inp" type="text" placeholder="Link Steam" />
      <input id="linkEpic" class="inp" type="text" placeholder="Link Epic Games" />
      <input id="linkPlaystation" class="inp" type="text" placeholder="Link PlayStation" />
      <input id="linkXbox" class="inp" type="text" placeholder="Link Xbox" />
      <input id="linkSwitch" class="inp" type="text" placeholder="Link Nintendo Switch" />
      <input id="linkAndroid" class="inp" type="text" placeholder="Link Android (Play Store)" />
      <input id="linkApple" class="inp" type="text" placeholder="Link Apple (App Store)" />
      <input id="linkLinux" class="inp" type="text" placeholder="Link Linux (site/loja)" />

      <button id="submitGame" class="main-btn" type="submit">Salvar Alterações</button>
      <p id="msg" class="msg"></p>
    </form>
  </main>

  <script src="js/editarjogo.js"></script>
  <script src="js/logout.js"></script>
</body>
</html>
