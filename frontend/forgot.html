<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta name="color-scheme" content="light">
  <meta charset="UTF-8">
  <title>EcoPlay Critics - Recuperar Senha</title>

  <link rel="stylesheet" href="css/forgot.css">
  <link href="https://fonts.googleapis.com/css2?family=Cinzel&display=swap" rel="stylesheet">
</head>
<body>

  <header class="navbar">
    <div class="brand">
      <a href="index.html" class="logo-link">
       <img src="img/logo.png" alt="EcoPlay Critics" class="logo-img">
     </a>
    </div>

    <nav class="navlinks">
      <a href="jogos.html">Jogos</a>
      <span>|</span>
      <a href="sobre.html">Sobre Nós</a>
      <span>|</span>
      <a href="ajuda.html">Ajuda</a>
    </nav>

    <div class="navright">
      <div class="searchwrap">
        <input type="text" placeholder="Procurar">
        <span class="search-icon">🔍</span>
      </div>

      <a href="login.html" class="login-btn">Login</a>
    </div>
  </header>

  <main class="main">
    <div class="card">
      <h1>Esqueci Minha Senha</h1>
      <div class="divider"></div>

      <div id="formBox">
        <div class="form-forgot">
          <input type="email" id="email" placeholder="Email" required>
          <button type="button" onclick="recuperar()">Enviar</button>
        </div>
      </div>

      <div id="successBox" style="display:none;">
        <p>Se este email existir, você receberá um link para redefinir sua senha.</p>
      </div>

    </div>
  </main>

  <script src="js/forgot.js"></script>
</body>
</html>
